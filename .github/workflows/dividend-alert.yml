# 个人投资助理 · 红利到价「去重状态」维护（云端，不依赖本地开机）
#
# 分工（2026-10-30 起）：
#   · 推送 = WorkBuddy 云端定时任务（北京 10:15，手机端可管理），见 cloud-alert.js
#   · 本 workflow = 只维护去重状态 data/alert-state.json（ALERT_CHANNEL=none，不推送），
#     因为云端沙箱没有持久盘，状态必须由某个能写仓库的地方来记 —— 否则「信号持续期间」会天天重复推。
#     放在北京 18:30（收盘后、refresh.yml 刷新快照之后）跑：此时当天信号已定型，记录最准。
#   · 想让 GitHub 也能推送（例如 WorkBuddy 任务挂了要兜底）：把下面 ALERT_CHANNEL 改成 serverchan 即可，
#     但注意会与 WorkBuddy 云端任务双推，只建议临时切换。
# 与 alert-check.js 完全同一套口径（触发价/带宽/分级/去重），只是运行环境换成 GitHub Actions。
# ── 说明 ────────────────────────────────────────────────
# · 周末/节假日 cron 仍会跑，但行情返回上一交易日收盘价，不会产生新信号，直接空跑结束。
name: 红利到价提醒（状态维护）
on:
  schedule:
    - cron: "30 10 * * 1-5"     # UTC 10:30 = 北京 18:30，周一~周五
  workflow_dispatch: {}        # 支持手动触发验证
permissions:
  contents: write
concurrency:
  group: dividend-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检测信号并维护去重状态（不推送，推送由 WorkBuddy 云端任务负责）
        env:
          ALERT_CHANNEL: "none"                # 显式关闭本 workflow 的推送，避免与云端任务双发
          ALERT_RUNNER: "GitHub Actions（仅状态维护）"
          ALERT_EXEC_BASE: ${{ vars.ALERT_EXEC_BASE }}
        run: node alert-check.js --cloud

      - name: 回写去重状态（云端无持久盘 → 存回仓库）
        run: |
          git config user.name "ia-bot"
          git config user.email "ia-bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/alert-state.json
          if git diff --cached --quiet; then
            echo "去重状态无变化，跳过提交"
          else
            git commit -m "alert: state $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git push origin HEAD:main
          fi
